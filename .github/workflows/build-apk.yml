name: Build Android APK (v7)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Standalone APK
    runs-on: ubuntu-latest

    steps:
      - name: 🔁 Checkout código
        uses: actions/checkout@v4

      - name: ☕ Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Instalar dependências
        run: npm install --legacy-peer-deps

      - name: 🏗️ Gerar projeto nativo (prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: 📦 Gerar Bundle JS Offline (Expo SDK 54 style)
        run: |
          mkdir -p android/app/src/main/assets
          npx expo export:embed \
            --platform android \
            --entry-file index.ts \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res/ \
            --dev false

      - name: 🔍 Verificar arquivos gerados
        run: |
          ls -R android/app/src/main/assets/ || echo "Assets folder empty"
          ls -l android/gradlew

      - name: 🔑 Configurar permissões
        run: chmod +x android/gradlew

      - name: 🔨 Compilar APK (Standalone)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 📤 Upload APK Instalável
        uses: actions/upload-artifact@v4
        with:
          name: EncartesPro-Build
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
