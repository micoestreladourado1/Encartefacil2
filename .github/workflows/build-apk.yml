name: Build Android APK (v6)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Standalone APK
    runs-on: ubuntu-latest

    steps:
      - name: 🔁 Checkout código
        uses: actions/checkout@v4

      - name: ☕ Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Instalar dependências
        run: npm ci

      - name: 🏗️ Gerar projeto nativo (prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: 📋 Criar diretório de assets
        run: mkdir -p android/app/src/main/assets

      - name: 📦 Gerar Bundle JS Offline
        run: |
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.ts \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res/

      - name: 🔍 Verificar arquivos gerados
        run: |
          ls -l android/app/src/main/assets/
          ls -l android/gradlew

      - name: 🔑 Configurar permissões
        run: chmod +x android/gradlew

      - name: 🔨 Compilar APK (Debug Offline)
        run: |
          cd android
          # Usamos assembleDebug pois ele não exige chaves de produção (keystore)
          # Mas como já geramos o bundle acima, ele será incluído no APK.
          ./gradlew assembleDebug --no-daemon

      - name: 📤 Upload APK Instalável
        uses: actions/upload-artifact@v4
        with:
          name: EncartesFacil-v6
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
