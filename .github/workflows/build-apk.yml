name: Build Android APK (FINAL)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Standalone APK
    runs-on: ubuntu-latest

    steps:
      - name: 🔁 Checkout código
        uses: actions/checkout@v4

      - name: ☕ Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Instalar dependências
        run: npm ci

      - name: 🏗️ Gerar projeto nativo (prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: 📋 Preparar estrutura e bundle
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.ts \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res/

      - name: 🔑 Configurar permissões e assinatura de Debug para Release
        run: |
          chmod +x android/gradlew
          # Comando para usar a chave de debug em builds de release (facilita o teste sem keystore)
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' android/app/build.gradle

      - name: 🔨 Compilar APK (Release v5)
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 📤 Upload APK Instalável
        uses: actions/upload-artifact@v4
        with:
          name: EncartesFacil-Final
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
