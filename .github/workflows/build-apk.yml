name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: 🔁 Checkout código
        uses: actions/checkout@v4

      - name: ☕ Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Instalar dependências
        run: npm ci

      - name: 🏗️ Gerar projeto nativo Android (prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: 📦 Gerar Bundle JS Offline
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.ts \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res \
            --reset-cache

      - name: 🔑 Configurar permissões do Gradle
        run: chmod +x android/gradlew

      - name: 🔨 Compilar APK (Standalone Debug)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 📤 Upload APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: EncartesFacil-Instalador
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
